
name: Deploy Java Application and Run Playwright Tests

on:
  repository_dispatch:
    types:
      - java-app-updated

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: [self-hosted, Windows, X64, tomcat-local]

    env:
      TOMCAT_HOME: 'C:\Tomcat_1\apache-tomcat-11.0.27'
      APP_NAME: 'greeting-app'
      BASE_URL: 'http://localhost:8080/greeting-app'

    steps:
      # 1. Checkout Playwright project
      - name: Checkout Playwright repository
        uses: actions/checkout@v7

      # 2. Checkout Java project
      - name: Checkout Java repository
        uses: actions/checkout@v7
        with:
          repository: cyqatester/springboot-tomcat11-greeting
          token: ${{ secrets.JAVA_REPO_READ_TOKEN }} #token expires Nov 30, 2026
          path: java-app
          ref: ${{ github.event.client_payload.java_sha || 'main' }}

      # 3. Setup Java 25
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java-app/pom.xml

      # 4. Build WAR
      - name: Build Java application
        working-directory: java-app
        shell: pwsh
        run: |
          if (Test-Path "mvnw.cmd") {
            .\mvnw.cmd -B clean package
          } else {
            mvn -B clean package
          }

      # 5. Deploy WAR to Tomcat
      - name: Deploy WAR to local Tomcat
        shell: pwsh
        run: |
          $tomcat = $env:TOMCAT_HOME
          $webapps = Join-Path $tomcat "webapps"
          $bin = Join-Path $tomcat "bin"

          $warFiles = @(
            Get-ChildItem "java-app/target" -Filter "*.war" |
            Where-Object { $_.Name -notlike "original-*" }
          )

          if ($warFiles.Count -ne 1) {
            throw "Expected exactly one WAR file, found $($warFiles.Count)."
          }

          $war = $warFiles[0]
          $destination = Join-Path $webapps "$env:APP_NAME.war"
          $exploded = Join-Path $webapps $env:APP_NAME

          if (-not (Test-Path $webapps)) {
            throw "Tomcat webapps directory not found: $webapps"
          }

          if (-not (Test-Path (Join-Path $bin "shutdown.bat"))) {
            throw "Tomcat shutdown.bat not found."
          }

          if (-not (Test-Path (Join-Path $bin "startup.bat"))) {
            throw "Tomcat startup.bat not found."
          }

          Write-Host "Stopping Tomcat..."

          & (Join-Path $bin "shutdown.bat")

          # Wait for Tomcat to release its files
          Start-Sleep -Seconds 10

          if (Test-Path $destination) {
            Remove-Item $destination -Force
          }

          if (Test-Path $exploded) {
            Remove-Item $exploded -Recurse -Force
          }

          Write-Host "Copying WAR file..."

          Copy-Item $war.FullName $destination

          Write-Host "Starting Tomcat..."

          & (Join-Path $bin "startup.bat")

          Write-Host "Deployment completed."

      # 6. Wait for application
      - name: Wait for application startup
        shell: pwsh
        run: |
          $url = $env:BASE_URL
          $timeout = (Get-Date).AddSeconds(180)

          do {
            try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -TimeoutSec 10

              if ($response.StatusCode -ge 200 -and
                  $response.StatusCode -lt 400) {
                Write-Host "Application is ready: $url"
                exit 0
              }
            }
            catch {
              Write-Host "Waiting for application..."
              Start-Sleep -Seconds 5
            }
          } while ((Get-Date) -lt $timeout)

          throw "Application did not become available: $url"

      # 7. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 8. Install dependencies
      - name: Install npm dependencies
        run: npm ci

      # 9. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      # 10. Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      # 11. Upload test report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
